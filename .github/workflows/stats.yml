name: Update stats card

on:
  schedule:
    - cron: "0 4 * * *" # todo dia as 04:00 UTC (01:00 em Sao Paulo)
  push:
    paths:
      - ".github/workflows/stats.yml"
      - "scripts/build_stats.py"
  workflow_dispatch: # permite rodar manualmente na aba "Actions"

# evita duas execucoes commitando ao mesmo tempo
concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats card
        env:
          # GH_TOKEN so existe se voce criar o secret; senao cai no token padrao
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_stats.py --login ${{ github.repository_owner }} --out assets/stats.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --staged --quiet && echo "sem mudancas" && exit 0
          git commit -m "chore: update stats card"
          git push
