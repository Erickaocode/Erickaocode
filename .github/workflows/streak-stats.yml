name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *" # Roda todo dia às 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml" # Roda sempre que este arquivo for modificado
  workflow_dispatch: # Permite rodar manualmente na aba "Actions"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=Erickaocode&theme=tokyonight&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
